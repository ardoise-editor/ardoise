[package]
name = "ardoise"
version = "2.6.0"
edition = "2021"
rust-version = "1.90"
description = "A fast, stable, cross-platform text editor"
license = "MIT"
repository = "https://github.com/ardoise-editor/ardoise"
readme = "README.md"
keywords = ["text-editor", "editor", "syntax-highlighting"]
categories = ["text-editors"]

[[bin]]
name = "ardoise"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14", features = ["advanced", "tokio", "lazy", "selector", "canvas", "svg"] }
iced_aw = { version = "0.14", default-features = false, features = ["context_menu", "wrap"] }
iced_fonts = { version = "0.3", features = ["nerd", "lucide"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
rfd = "0.14"
dirs = "5"
rust-i18n = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "multipart", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync", "fs", "macros"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false }
tempfile = "3"
similar = "3.2.1"
unicode-width = "0.2"
trash = "5.3.0"
notify = "8"
# The protocol and manifest of the plugins (the editor needs only the types).
ardoise-plugin = { git = "https://github.com/ardoise-editor/plugin-sdk", tag = "v0.14.0", default-features = false }
# The archives the plugins are published as.
tar = { version = "0.4", default-features = false }
flate2 = "1"

# The system menu bar on macOS (File, Edit, View and Help up there).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.20", default-features = false }

[target.'cfg(unix)'.dependencies]
# A plugin dies with the editor (`PR_SET_PDEATHSIG`, Linux), and a stopped
# task takes its whole process group with it.
libc = "0.2"

[dev-dependencies]
# Checks that every file icon is a glyph of the bundled Nerd Font.
ttf-parser = "0.25"
# Draws the window to a PNG without a screen (`look_tests`, run by hand).
iced_test = "0.14"

# Text shaping and syntax highlighting are very slow unoptimized: jumping
# to the middle of a 3 000-line file took 30 s in a debug build.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer-scripts = "debian/"
# The package was called "simpleedit": installing this one replaces it.
conflicts = "simpleedit"
replaces = "simpleedit"
maintainer = "sindus"
copyright = "2024, sindus"
license-file = ["LICENSE", "0"]
extended-description = "A fast, stable, cross-platform text editor with syntax highlighting for 30+ languages."
depends = "$auto"
recommends = "policykit-1 | pkexec"
section = "editors"
priority = "optional"
assets = [
    ["target/release/ardoise", "usr/bin/", "755"],
    ["assets/ardoise.desktop", "usr/share/applications/", "644"],
    ["assets/ardoise.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["assets/ardoise.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

# Patched copies of iced 0.14.1 crates; see vendor/PATCHES.md (a test fails
# when a patch is no longer applied).
# - iced_winit: without winit's default macOS menu, whose Cmd+Q quits without
#   saving the session.
# - iced_graphics: `set_hidden_lines` for code folding.
[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }
iced_graphics = { path = "vendor/iced_graphics" }
